
name: my_toolbox
description: "My Toolbox - Aplicación de herramientas desarrollada en Flutter"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  intl: ^0.20.3
  url_launcher: ^6.3.3
  audioplayers: ^6.8.1
  html: ^0.15.7
  xml: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/pokemon/
    - assets/profile/
    - assets/images/
